name: CI-CD GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== CI: LINT / TEST =====
    - name: HTML Lint
      run: |
        sudo apt install -y tidy
        tidy -e index.html || true

    # ===== BUILD =====
    - name: Prepare build
      run: |
        mkdir dist
        cp -r * dist/

    # ===== DEPLOY =====
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
