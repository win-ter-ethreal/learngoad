name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Tahap 1: Security Check (opsional, sudah kamu buat)
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      # Tambahkan langkah-langkah scan keamanan di sini kalau perlu

  # Tahap 2: Deploy ke VPS
  deploy:
    needs: security-check   # hanya jalan kalau security-check sukses
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}        # IP server, misalnya 202.10.48.204
          username: ${{ secrets.SERVER_USER }}    # user login, misalnya root
          key: ${{ secrets.SSH_PRIVATE_KEY }}     # private key dari laptop kamu
          port: 22
          script: |
            # Masuk ke folder project di server
            cd /var/www/html/learngoad

            # Tarik kode terbaru dari GitHub
            git pull origin main

            # Restart container atau service (sesuaikan dengan server kamu)
            docker restart my-website-container

            # Cek status container setelah restart
            docker ps
